<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Что показать участникам?</title>
  <link rel="stylesheet" href="/picker.css" />
</head>
<body>
  <header><div class="mark">↗</div><div><h1>Что показать участникам?</h1><p>Выберите экран или отдельное окно для трансляции.</p></div></header>
  <nav aria-label="Источники"><button id="screens" class="active" type="button">Экраны</button><button id="windows" type="button">Окна</button><button id="refresh" type="button">Обновить</button></nav>
  <main id="sources" aria-live="polite"><p>Получаем список экранов и окон…</p></main>
  <footer><label id="audio-label" hidden><input id="audio" type="checkbox" aria-describedby="audio-description" /><span>Передавать звук компьютера<small id="audio-description"></small></span></label><div class="actions"><button id="cancel" type="button">Отмена</button><button id="share" class="primary" type="button" disabled>Начать трансляцию</button></div></footer>
  <script src="/picker.js"></script>
</body>
</html>
